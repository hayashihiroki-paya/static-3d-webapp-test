<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>3D Mini Game - Mobile Joystick</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>

  <style>
    html,body { height:100%; margin:0; background:#000; font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial; }
    #canvas { display:block; width:100vw; height:100vh; }

    /* UI コンテナ */
    #mobile-controls {
      position: fixed;
      inset: auto 0 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 16px;
      pointer-events: auto;
      z-index: 9999;
      box-sizing: border-box;
    }

    /* スティック領域（左） */
    #stick-area {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    #stick-base {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      position: relative;
    }

    #stick-knob {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      transition: background .08s;
      touch-action: none;
    }

    /* ジャンプボタン（右） */
    #jump-area {
      width: 120px;
      height: 120px;
      display:flex;
      align-items:center;
      justify-content:center;
      touch-action: none;
    }

    #jump-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      border: none;
      -webkit-tap-highlight-color: transparent;
    }

    #jump-btn:active { background: rgba(255,255,255,0.36); }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- モバイルUI：左スティック、右ジャンプ -->
  <div id="mobile-controls" aria-hidden="false">
    <div id="stick-area" aria-label="move stick">
      <div id="stick-base">
        <div id="stick-knob"></div>
      </div>
    </div>

    <div id="jump-area">
      <button id="jump-btn" aria-label="jump">JUMP</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
